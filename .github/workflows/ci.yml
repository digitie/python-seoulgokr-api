name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Scan tracked files for key literals
        run: python scripts/check_no_secrets.py

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"

      - name: Sync locked development environment
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked --extra dev ruff check src tests

      - name: Type check
        run: uv run --locked --extra dev mypy src

      - name: Test
        run: uv run --locked --extra dev python -m pytest -q

      - name: Run transport regression tests
        run: uv run --locked --extra dev python -m pytest -q tests/test_client.py tests/test_limits.py

      - name: Build distributions
        run: uv run --locked --extra dev python -m build --wheel --sdist

      - name: Validate distributions
        run: uv run --locked --extra dev python -m twine check dist/*

      - name: Check sdist contents
        shell: bash
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '(^|/)(AGENTS\.md|CLAUDE\.md|SKILL\.md|\.github/|docs/|scripts/|tests/|examples/)'; then
            echo "internal project files leaked into the source distribution"
            exit 1
          fi

      - name: Clean wheel installation smoke
        shell: bash
        run: |
          rm -rf /tmp/seoulgokr-clean
          uv venv /tmp/seoulgokr-clean/venv
          uv pip install --python /tmp/seoulgokr-clean/venv/bin/python dist/*.whl
          /tmp/seoulgokr-clean/venv/bin/python -c "import seoulgokr; print(seoulgokr.SeoulOpenDataClient.__name__)"
