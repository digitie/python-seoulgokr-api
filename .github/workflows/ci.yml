name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"

      - name: Sync locked development environment
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked --extra dev ruff check src tests

      - name: Type check
        run: uv run --locked --extra dev mypy src

      - name: Test
        run: uv run --locked --extra dev python -m pytest -q

      - name: Build distributions
        run: uv run --locked --extra dev python -m build --wheel --sdist
