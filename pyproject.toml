[build-system]
requires = ["hatchling>=1.25,<1.30"]
build-backend = "hatchling.build"

[project]
name = "seoulgokr"
version = "0.1.0.dev0"
description = "Async provider library for Seoul Open Data Plaza transportation APIs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "mypy>=1.10,<2.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "respx>=0.21,<1.0",
  "ruff>=0.6,<1.0",
  "twine>=5.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seoulgokr"]

[tool.hatch.build.targets.sdist]
include = [
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
  "src/**",
]
exclude = [
  "AGENTS.md",
  "CLAUDE.md",
  "SKILL.md",
  ".agents/**",
  ".claude/**",
  ".codex/**",
  ".github/**",
  ".gitignore",
  "docs/**",
  "examples/**",
  "scripts/**",
  "tests/**",
  "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
